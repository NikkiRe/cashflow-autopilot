name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [".", "forecast-service"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test backend
        working-directory: ${{ matrix.project }}
        run: mvn -B -q verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        working-directory: frontend
        run: npm ci && npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: cashflow-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and start stack
        timeout-minutes: 12
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Check forecast and recovery through Nginx
        timeout-minutes: 10
        run: python3 scripts/e2e.py
      - name: Show containers and logs on failure
        if: failure()
        timeout-minutes: 1
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200
      - name: Remove stack and test data
        if: always()
        timeout-minutes: 2
        run: docker compose down --volumes --remove-orphans
