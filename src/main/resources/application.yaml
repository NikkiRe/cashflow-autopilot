spring:
  application:
    name: cashflow-autopilot

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cashflow}
    username: ${DB_USERNAME:cashflow}
    password: ${DB_PASSWORD:cashflow_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8060

logging:
  level:
    com.cashflow: DEBUG

cashflow:
  demo:
    enabled: true
    seed-on-startup: true
    presentation-mode: true
    disclaimer: "All monetary figures are simulated for demonstration. No real funds or payment rails are connected."
    currency-label: "USD (simulated)"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
