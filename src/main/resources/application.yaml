spring:
  application:
    name: cashflow-autopilot

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cashflow}
    username: ${DB_USERNAME:cashflow}
    password: ${DB_PASSWORD:cashflow_password}
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 10000
    admin:
      fail-fast: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8060

logging:
  level:
    com.cashflow: DEBUG

cashflow:
  events:
    topic: cashflow.account-snapshots.v1
    publish-enabled: ${EVENTS_PUBLISH_ENABLED:true}
  forecast-url: ${FORECAST_URL:http://localhost:8070}
  demo:
    enabled: true
    seed-on-startup: true
    presentation-mode: true
    disclaimer: "All monetary figures are simulated for demonstration. No real funds or payment rails are connected."
    currency-label: "USD (simulated)"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
